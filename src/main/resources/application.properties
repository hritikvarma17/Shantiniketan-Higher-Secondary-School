spring.application.name=shantiniketan 
server.port=9999

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.web=DEBUG

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/web-inf/jsp/
spring.mvc.view.suffix=.jsp

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


spring.thymeleaf.cache=false
spring.freemarker.cache=false

spring.resources.cache.period=0

# Give Thymeleaf higher priority (checked first)
spring.thymeleaf.order=1

# Give JSP view resolver lower priority (checked as a fallback)
spring.mvc.view.order=2

# Increase file upload size limits (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# If using a resource handler path cache:
#spring.resources.chain.strategy.content.enabled=false
#spring.resources.chain.strategy.fixed.enabled=false