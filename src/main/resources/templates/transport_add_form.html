<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Transport | Shantiniketan Higher Secondary School</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
	crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/style.css}">
<link rel="stylesheet" th:href="@{/students_style.css}">
</head>
<body class="bg-light">
	<header>
		<nav
			class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow fixed-top"
			style="max-height: 72px; border-bottom-left-radius: 50px; border-bottom: 2px solid #FFC107;">
			<div class="container-fluid">
				<a class="navbar-brand d-flex align-items-center gap-2"
					th:href="@{/}"> <img
					th:src="@{/Images/shantiniketan-logo-nav-bar.png}"
					alt="Shantiniketan School Logo" height="46">

					<div class="d-flex flex-column leading-tight">
						<span class="fw-bold text-uppercase"
							style="font-size: 1.15rem; letter-spacing: 1px; color: #f8f9fa;">
							Shantiniketan </span> <span class="text-warning text-uppercase"
							style="font-size: 0.65rem; letter-spacing: 1.5px; font-weight: 600;">
							Higher Secondary School </span>
					</div>
				</a>

				<div class="collapse navbar-collapse" id="navMenu">
					<ul
						class="navbar-nav nav-pills ms-auto align-items-lg-center gap-1 mt-3 mt-lg-0"
						style="cursor: pointer;">
						<th:block th:if="${session.user != null}">
							<li class="nav-item"><a th:href="@{/transport}"
								class="btn btn-outline-warning rounded-pill px-3 py-2 fw-semibold btn-sm">
									<i class="fa-solid fa-arrow-left me-1"></i> Back to Transport
							</a></li>
						</th:block>
					</ul>
				</div>
			</div>
		</nav>
	</header>

	<main style="margin-top: 90px;" class="container py-4 mb-5">
		<div class="row justify-content-center">
			<div class="col-lg-12">
				<div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">

					<div
						class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
						<div>
							<h3 class="fw-bold text-dark mb-1">
								<i class="fa-solid fa-bus text-warning me-2"></i>Add New Transport Vehicle
							</h3>
							<p class="text-muted small mb-0">Fill in the vehicle and driver details below.</p>
						</div>
					</div>

					<!-- Error Alert Banner -->
					<div th:if="${errorMessage}"
						class="alert alert-danger alert-dismissible fade show mb-4"
						role="alert">
						<i class="fa-solid fa-triangle-exclamation me-2"></i> <span
							th:text="${errorMessage}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>

					<form th:action="@{/transport/save}" th:object="${transport}" method="POST"
						enctype="multipart/form-data">

						<div class="row g-3">
							<!-- Vehicle Company -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Vehicle Company <span
									class="text-danger">*</span></label> 
								<input type="text" class="form-control" th:field="*{vehicleCompany}"
									placeholder="e.g. Tata, Ashok Leyland" required>
							</div>

							<!-- Vehicle Model -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Vehicle Model <span
									class="text-danger">*</span></label> 
								<input type="text" class="form-control"
									th:field="*{vehicleModel}" placeholder="e.g. Starbus, Viking" required>
							</div>

							<!-- Number Plate No -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Number Plate No <span
									class="text-danger">*</span></label> 
								<input type="text" class="form-control"
									th:field="*{numberPlateNo}" placeholder="e.g. GJ-01-AB-1234" required>
							</div>

							<!-- Seating Capacity -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Seating Capacity <span
									class="text-danger">*</span></label> 
								<input type="number" class="form-control"
									th:field="*{seatingCapacity}" placeholder="e.g. 40" min="1" required>
							</div>

							<!-- Driver Selection (Fetched from Staff DB) -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Driver Name <span
									class="text-danger">*</span></label> 
								<select id="driverSelect" th:field="*{driverName}" class="form-select" required onchange="updateDriverMobile()">
									<option value="" disabled selected>-- Select Driver --</option>
									<th:block th:each="d : ${drivers}">
										<option th:value="${d.firstName + ' ' + d.lastName}" 
												th:text="${d.firstName + ' ' + d.lastName + ' (' + d.currentRole + ')'}"
												th:data-mobile="${d.mobile}">
										</option>
									</th:block>
								</select>
							</div>

							<!-- Driver Mobile No (Auto-fetched) -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Driver Mobile No (Auto-fetched)</label> 
								<input type="text" id="driverMobileNo" th:field="*{driverMobileNo}" class="form-control bg-light" readonly placeholder="Select a driver to view mobile">
							</div>

							<!-- AC / Non-AC -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">AC / Non-AC <span
									class="text-danger">*</span></label> 
								<select class="form-select" th:field="*{acNonAc}" required>
									<option value="" disabled selected>Select Type</option>
									<option value="AC">AC</option>
									<option value="Non-AC">Non-AC</option>
								</select>
							</div>

							<!-- Insurance Expiry Date -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">Insurance Expiry Date <span
									class="text-danger">*</span></label> 
								<input type="date" class="form-control" th:field="*{insuranceExpiryDate}" required>
							</div>

							<!-- Status -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">Status <span
									class="text-danger">*</span></label> 
								<select class="form-select" th:field="*{status}" required>
									<option value="Active">Active</option>
									<option value="In Maintenance">In Maintenance</option>
									<option value="Inactive">Inactive</option>
								</select>
							</div>

							<!-- Vehicle Image File Upload -->
							<div class="col-12 mt-3">
								<label class="form-label fw-semibold small">
									<i class="fa-solid fa-camera me-1 text-warning"></i> Vehicle Image (Big Photo)
								</label> 
								<input type="file" class="form-control" name="vehicleImageFile" accept="image/*">
							</div>

							<!-- Submit Buttons -->
							<div
								class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
								<a th:href="@{/transport}"
									class="btn btn-light rounded-pill px-4 fw-semibold border">Cancel</a>
								<button type="submit"
									class="btn btn-warning rounded-pill px-5 fw-semibold text-dark shadow-sm">
									<i class="fa-solid fa-save me-1"></i> Save Vehicle
								</button>
							</div>

						</div>
					</form>

				</div>
			</div>
		</div>
	</main>

	<!-- JavaScript to auto-fill driver mobile number from selected dropdown option -->
	<script>
		function updateDriverMobile() {
			var select = document.getElementById("driverSelect");
			var selectedOption = select.options[select.selectedIndex];
			var mobile = selectedOption.getAttribute("data-mobile");
			document.getElementById("driverMobileNo").value = mobile ? mobile : "";
		}
	</script>
</body>
</html>
