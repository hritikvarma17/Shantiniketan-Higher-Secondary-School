<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Staff | Shantiniketan Higher Secondary School</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
	crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/style.css}">
<link rel="stylesheet" th:href="@{/students_style.css}">
<style>
.custom-timetable-select {
	background-color: #212529 !important;
	color: #ffc107 !important;
	border: 1px solid #ffc107 !important;
	font-weight: 600;
	border-radius: 50rem !important;
	padding: 0.375rem 2rem 0.375rem 0.75rem;
	box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
	transition: all 0.2s ease-in-out;
	background-image:
		url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffc107' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e")
		!important;
	background-repeat: no-repeat !important;
	background-position: right 0.75rem center !important;
	background-size: 16px 12px !important;
	appearance: none;
	-webkit-appearance: none;
	-moz-appearance: none;
}

.custom-timetable-select:hover, .custom-timetable-select:focus {
	background-color: #343a40 !important;
	color: #ffca2c !important;
	border-color: #ffca2c !important;
	box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
}

.custom-timetable-select option {
	background-color: #212529;
	color: #fff;
}
</style>
</head>
<body class="bg-light">
	<header>
		<nav
			class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow fixed-top"
			style="max-height: 72px; border-bottom-left-radius: 50px; border-bottom: 2px solid #FFC107;">
			<div class="container-fluid">
				<a class="navbar-brand d-flex align-items-center gap-2"
					th:href="@{/}"> <img
					th:src="@{/Images/shantiniketan-logo-nav-bar.png}"
					alt="Shantiniketan School Logo" height="46">

					<div class="d-flex flex-column leading-tight">
						<span class="fw-bold text-uppercase"
							style="font-size: 1.15rem; letter-spacing: 1px; color: #f8f9fa;">
							Shantiniketan </span> <span class="text-warning text-uppercase"
							style="font-size: 0.65rem; letter-spacing: 1.5px; font-weight: 600;">
							Higher Secondary School </span>
					</div>
				</a>



				<div class="collapse navbar-collapse" id="navMenu">
					<ul
						class="navbar-nav nav-pills ms-auto align-items-lg-center gap-1 mt-3 mt-lg-0"
						style="cursor: pointer;">
						<th:block th:if="${session.user != null}">
							<li class="nav-item"><a th:href="@{/staff}"
								class="btn btn-outline-warning rounded-pill px-3 py-2 fw-semibold btn-sm">
									<i class="fa-solid fa-arrow-left me-1"></i> Back to Staff
							</a></li>
						</th:block>
					</ul>
				</div>
			</div>
		</nav>
	</header>

	<main style="margin-top: 90px;" class="container py-4 mb-5">
		<div class="row justify-content-center">
			<div class="col-lg-12">
				<div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">

					<div
						class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
						<div>
							<h3 class="fw-bold text-dark mb-1">
								<i class="fa-solid fa-user-plus text-warning me-2"></i>Add New
								Staff Member
							</h3>
							<p class="text-muted small mb-0">Fill in the professional and
								personal details below.</p>
						</div>

					</div>

					<!-- Error Alert Banner -->
					<div th:if="${errorMessage}"
						class="alert alert-danger alert-dismissible fade show mb-4"
						role="alert">
						<i class="fa-solid fa-triangle-exclamation me-2"></i> <span
							th:text="${errorMessage}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>

					<form th:action="@{/staff/save}" th:object="${staff}" method="POST"
						enctype="multipart/form-data">

						<div class="row g-3">
							<!-- First Name -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">First Name <span
									class="text-danger">*</span></label> <input type="text"
									class="form-control" th:field="*{firstName}"
									placeholder="e.g. Arundhati" required>
							</div>

							<!-- Middle Name -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">Middle Name</label>
								<input type="text" class="form-control"
									th:field="*{middleName}" placeholder="e.g. Tarachand">
							</div>

							<!-- Last Name -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">Last Name <span
									class="text-danger">*</span></label> <input type="text"
									class="form-control" th:field="*{lastName}"
									placeholder="e.g. Roy" required>
							</div>

							<!-- Category / Role Type -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Category /
									Role Type <span class="text-danger">*</span>
								</label> <select class="form-select" th:field="*{roleType}" required>
									<option value="">Select Category</option>
									<option value="Leadership & HOD">Leadership & HOD</option>
									<option value="Teacher">Teacher</option>
									<option value="IT & Admin">IT & Admin</option>
									<option value="Support & Maintenance">Support &
										Maintenance</option>
								</select>
							</div>

							<!-- Current Role Title -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Current
									Designation / Role <span class="text-danger">*</span>
								</label> <input type="text" class="form-control"
									th:field="*{currentRole}"
									placeholder="e.g. Principal & Academic Director" required>
							</div>

							<!-- Study Qualification -->
							<div class="col-md-8">
								<label class="form-label fw-semibold small">Study
									Qualification <span class="text-danger">*</span>
								</label> <input type="text" class="form-control"
									th:field="*{studyQualification}"
									placeholder="e.g. Ph.D. in Educational Pedagogy" required>
							</div>

							<!-- Work Experience -->
							<div class="col-md-4">
								<label class="form-label fw-semibold small">Work
									Experience (Years) <span class="text-danger">*</span>
								</label> <input type="number" class="form-control"
									th:field="*{workExperienceYears}" placeholder="e.g. 15"
									min="0" required>
							</div>

							<!-- Mobile -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Mobile
									Number <span class="text-danger">*</span>
								</label> <input type="tel" class="form-control" th:field="*{mobile}"
									placeholder="e.g. 9876543210" required>
							</div>

							<!-- Email -->
							<div class="col-md-6">
								<label class="form-label fw-semibold small">Email
									Address <span class="text-danger">*</span>
								</label> <input type="email" class="form-control" th:field="*{email}"
									placeholder="e.g. name@shantiniketan.edu" required>
							</div>

							<!-- Address -->
							<div class="col-12">
								<label class="form-label fw-semibold small">Residential
									Address <span class="text-danger">*</span>
								</label>
								<textarea class="form-control" th:field="*{address}" rows="2"
									placeholder="Enter complete address" required></textarea>
							</div>

							<!-- DOB -->
							<div class="col-md-3">
								<label class="form-label fw-semibold small">Date of
									Birth <span class="text-danger">*</span>
								</label> <input type="date" class="form-control" th:field="*{dob}"
									required>
							</div>

							<!-- Gender -->
							<div class="col-md-3">
								<label class="form-label fw-semibold small">Gender <span
									class="text-danger">*</span></label> <select class="form-select"
									th:field="*{gender}" required>
									<option value="">Select</option>
									<option value="MALE">Male</option>
									<option value="FEMALE">Female</option>
									<option value="OTHER">Other</option>
								</select>
							</div>

							<!-- Blood Group -->
							<div class="col-md-3">
								<label class="form-label fw-semibold small">Blood Group</label>
								<select class="form-select" th:field="*{bloodGroup}">
									<option value="">Select</option>
									<option value="A+">A+</option>
									<option value="A-">A-</option>
									<option value="B+">B+</option>
									<option value="B-">B-</option>
									<option value="AB+">AB+</option>
									<option value="AB-">AB-</option>
									<option value="O+">O+</option>
									<option value="O-">O-</option>
								</select>
							</div>

							<!-- Joining Date -->
							<div class="col-md-3">
								<label class="form-label fw-semibold small">Joining Date
									<span class="text-danger">*</span>
								</label> <input type="date" class="form-control"
									th:field="*{joiningDate}" required>
							</div>

							<!-- Passport Photo File Upload -->
							<div class="col-12 mt-3">
								<label class="form-label fw-semibold small"><i
									class="fa-solid fa-camera me-1 text-warning"></i> Passport
									Photo Upload</label> <input type="file" class="form-control"
									name="photoFile" accept="image/*" required>
							</div>

							<!-- Submit Buttons -->
							<div
								class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
								<a th:href="@{/staff}"
									class="btn btn-light rounded-pill px-4 fw-semibold border">Cancel</a>
								<button type="submit"
									class="btn btn-warning rounded-pill px-5 fw-semibold text-dark shadow-sm">
									<i class="fa-solid fa-save me-1"></i> Save Staff Member
								</button>
							</div>

						</div>
					</form>

				</div>
			</div>
		</div>
	</main>
</body>
</html>
