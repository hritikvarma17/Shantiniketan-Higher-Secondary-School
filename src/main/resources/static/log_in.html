<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Login | Shantiniketan Higher Secondary School</title>

<!-- Bootstrap 5 & Font Awesome -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
	rel="stylesheet">

<!-- Custom Stylesheet -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="log_in_style.css">
<link rel="icon" type="image/x-icon" href="Images/favicon.ico">


</head>

<body class="login-standalone-body">

	<div class="standalone-login-card">

		<!-- Top Header with Logo & School Name -->
		<div class="login-card-top-header">
			<div class="login-school-logo-wrap">
				<img src="Images/shantiniketan-logo-nav-bar.png"
					alt="Shantiniketan School Logo" height="42">
			</div>
			<h3 class="login-school-title">Shantiniketan</h3>
			<span class="login-school-subtitle">Higher Secondary School</span>
		</div>

		<!-- Card Body Form -->
		<div class="login-card-body">

			<div class="text-center">
				<span class="portal-sub-badge"> <i
					class="fa-solid fa-lock text-warning me-1"></i> Authorized Portal
					Access
				</span>
			</div>
			<!-- Error Warning Alert -->
			<div id="error-alert" class="alert alert-danger py-2 text-center "
				style="display: none;" role="alert">Invalid username or
				password! Please try again.</div>
			<form action="loginprocess" method="POST" id="portalLoginForm"
				class="needs-validation" novalidate>

				<!-- Username Input -->
				<div class="mb-3">
					<label for="username"
						class="form-label fw-semibold small text-dark mb-1">
						Username <span class="text-danger">*</span>
					</label>
					<div class="input-group custom-input-group align-items-center">
						<span class="input-icon"> <i class="fa-solid fa-user"></i>
						</span> <input type="text" class="form-control" id="username"
							name="username" placeholder="Enter Username" required autofocus
							autocomplete="username">
					</div>
					<div class="invalid-feedback">Username is required.</div>
				</div>

				<!-- Password Input (Default Native Browser Support) -->
				<div class="mb-3">
					<div class="d-flex justify-content-between align-items-center mb-1">
						<label for="password"
							class="form-label fw-semibold small text-dark mb-0">
							Password <span class="text-danger">*</span>
						</label>
					</div>
					<div class="input-group custom-input-group align-items-center">
						<span class="input-icon"> <i class="fa-solid fa-key"></i>
						</span> <input type="password" class="form-control" id="password"
							name="password" placeholder="Enter password" required>
					</div>
					<div class="invalid-feedback">Password is required.</div>
				</div>


				<!-- Submit Button -->
				<button type="submit"
					class="btn btn-emerald-apply w-100 py-2 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
					<span>Log In</span> <i class="fa-solid fa-arrow-right"></i>
				</button>

			</form>

			<!-- Navigation Back to Home -->
			<div class="text-center mt-4 pt-3 border-top">
				<a href="/"
					class="back-home-link d-inline-flex align-items-center gap-1">
					<i class="fa-solid fa-arrow-left"></i> <span>Back to Website</span>
				</a>
			</div>

		</div>
	</div>

	<script>
            (() => {
                'use strict';
                const form = document.getElementById('portalLoginForm');
                if (form) {
                    form.addEventListener('submit', event => {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                }

                // Check if the URL contains ?error=invalid
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('error') === 'invalid') {
                    document.getElementById('error-alert').style.display = 'block';
                }
            })();
        </script>
	<script src="script.js"></script>
</body>

</html>
